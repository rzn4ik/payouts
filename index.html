<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель заявок</title>
<style>
:root{--bg:#0d0d15;--bg-card:#1a1a2a;--bg-inner:#0d0d15;--bg-input:#000;--text:#fff;--text-dim:#888;--text-mute:#555;--border:#2a2a3a;--accent:#a855f7;--accent-2:#10b981;--danger:#ef4444;--warning:#f59e0b;--heart:#ff4d6d;--info:#0ea5e9}
[data-theme="light"]{--bg:#f0f0f5;--bg-card:#fff;--bg-inner:#f7f7fa;--bg-input:#fff;--text:#1a1a2a;--text-dim:#666;--text-mute:#999;--border:#e0e0e8;--accent:#7c3aed;--accent-2:#059669}
[data-theme="ocean"]{--bg:#0a1628;--bg-card:#122236;--bg-inner:#0a1628;--bg-input:#0a1628;--text:#e0f2fe;--text-dim:#7dd3fc;--text-mute:#475569;--border:#1e3a5f;--accent:#0ea5e9;--accent-2:#14b8a6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);padding:15px;min-height:100vh;transition:background .3s,color .3s}
@keyframes pulseAlert{0%,100%{opacity:1}50%{opacity:.95}}
h1{font-size:16px;margin-bottom:5px;color:var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.badge{font-size:10px;padding:3px 8px;border-radius:8px;background:var(--border);color:var(--text-dim);font-weight:500}
.badge.admin{background:var(--accent);color:#fff}
.badge.worker{background:var(--accent-2);color:#fff}
.badge.client{background:var(--heart);color:#fff}
.badge.rate{background:var(--warning);color:#000}
.badge.clock{background:var(--info);color:#fff;font-family:monospace}
.badge.clock.bad{background:var(--danger)}
.me{font-size:11px;color:var(--text-dim);margin-bottom:15px}
.section{background:var(--bg-card);border-radius:10px;padding:14px;margin-bottom:12px;border:1px solid var(--border)}
h2{font-size:11px;margin:0 0 10px 0;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.add-form{display:grid;grid-template-columns:1.1fr 1.2fr 1fr 1fr .85fr .85fr .85fr auto;gap:6px;align-items:center}
.add-form input{padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-inner);color:var(--accent-2);font-size:12px;font-family:monospace;width:100%;min-width:0}
.add-form input:focus{outline:none;border-color:var(--accent)}
.add-form button{padding:8px 14px;border:none;border-radius:6px;background:var(--accent-2);color:#fff;font-weight:bold;cursor:pointer;white-space:nowrap;font-size:12px}
@media(max-width:1300px){.add-form{grid-template-columns:1fr 1fr 1fr 1fr}}
@media(max-width:700px){.add-form{grid-template-columns:1fr 1fr}}
.search-wrap{display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.search-wrap:focus-within{border-color:var(--accent)}
.search-icon{font-size:16px;color:var(--text-mute)}
.search-input{flex:1;padding:6px 0;border:none;background:transparent;color:var(--text);font-size:14px;font-family:inherit;outline:none;min-width:0}
.search-input::placeholder{color:var(--text-mute)}
.search-clear{padding:4px 10px;border:none;border-radius:5px;background:var(--text-mute);color:#fff;cursor:pointer;font-size:12px;font-weight:bold}
.search-clear:hover{background:var(--danger)}
.search-count{font-size:11px;color:var(--accent);font-weight:bold;white-space:nowrap}
.search-count.no-results{color:var(--danger)}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:none;border-radius:6px;background:var(--bg-card);color:var(--text-dim);font-weight:bold;cursor:pointer;font-size:12px;transition:all .2s}
.tabs button.active{background:var(--accent);color:#fff}
.tabs button.hidden{display:none}
.tabs button.expired-tab.active{background:var(--danger);color:#fff}
.tabs button.expired-tab{color:var(--danger)}
.card{background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--text-mute);border-radius:8px;padding:12px;margin-bottom:8px;transition:all .2s}
.card.available{border-left-color:var(--accent)}
.card.active{border-left-color:var(--accent-2)}
.card.active.warning{border-left-color:var(--warning)}
.card.active.expired{border-left-color:var(--danger)}
.card.done{border-left-color:var(--text-mute);opacity:.7}
.card.cancelled{border-left-color:var(--danger);opacity:.6}
.card.expired{border-left-color:var(--danger);background:linear-gradient(180deg,var(--bg-card) 0%,rgba(239,68,68,.06) 100%)}
.card.mine{box-shadow:0 0 0 2px var(--heart)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:5px}
.card-header b{font-size:15px;color:var(--text);font-weight:700}
.card-row{font-size:12px;margin-bottom:4px}
.card-row.small{font-size:10px;color:var(--text-dim)}
.card-row b{color:var(--accent)}
.card-num{cursor:pointer;color:var(--accent-2);font-family:monospace;white-space:nowrap}
.card-num:hover{text-decoration:underline}
.phone-num{cursor:pointer;color:var(--info);font-family:monospace;white-space:nowrap}
.phone-num:hover{text-decoration:underline}
.rate-value{color:var(--warning);font-family:monospace;font-weight:bold;cursor:pointer}
.rate-value:hover{text-decoration:underline}
.highlight{background:rgba(168,85,247,.35);padding:0 2px;border-radius:3px}
.expired-tag{display:inline-block;font-size:10px;font-weight:bold;padding:3px 8px;border-radius:6px;background:var(--danger);color:#fff;margin-bottom:4px}
.timer{font-family:monospace;font-size:15px;font-weight:bold;padding:5px 12px;border-radius:6px;background:var(--bg-inner);border:1px solid var(--border);letter-spacing:.5px;transition:color .3s,border-color .3s,background .3s}
.timer.gray{color:var(--text-mute)}
.timer.green{color:var(--accent-2);border-color:rgba(16,185,129,.3)}
.timer.yellow{color:var(--warning);border-color:rgba(245,158,11,.45);animation:timerPulseSlow 2.4s ease-in-out infinite}
.timer.orange{color:#ff8c00;border-color:rgba(255,140,0,.65);animation:timerPulseMedium 1.6s ease-in-out infinite}
.timer.red{color:var(--danger);border-color:var(--danger);animation:timerPulseFast .9s ease-in-out infinite}
.timer.dead{color:var(--danger);border-color:var(--danger);background:rgba(239,68,68,.15);text-decoration:line-through}
@keyframes timerPulseSlow{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0);background:var(--bg-inner)}50%{box-shadow:0 0 14px 1px rgba(245,158,11,.55);background:rgba(245,158,11,.12)}}
@keyframes timerPulseMedium{0%,100%{box-shadow:0 0 0 0 rgba(255,140,0,0);background:var(--bg-inner);transform:scale(1)}50%{box-shadow:0 0 18px 2px rgba(255,140,0,.65);background:rgba(255,140,0,.18);transform:scale(1.04)}}
@keyframes timerPulseFast{0%,100%{box-shadow:0 0 4px 0 rgba(239,68,68,.35);background:var(--bg-inner);transform:scale(1)}50%{box-shadow:0 0 24px 3px rgba(239,68,68,.85);background:rgba(239,68,68,.22);transform:scale(1.07)}}
.progress-bar{height:8px;background:var(--bg-inner);border-radius:4px;overflow:hidden;margin:6px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-2),#00ff88);transition:width .3s}
.checks-list{margin:6px 0}
.check-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--bg-inner);border-radius:5px;margin-bottom:3px;font-size:11px}
.check-item a{color:var(--accent-2);text-decoration:none}
.card-actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.card-actions button{padding:6px 12px;border:none;border-radius:5px;background:var(--accent);color:#fff;font-size:11px;cursor:pointer;font-weight:600}
.card-actions button.green{background:var(--accent-2)}
.card-actions button.red{background:var(--danger)}
.card-actions button.gray{background:var(--text-mute)}
.card-actions button.orange{background:var(--warning);color:#000}
.card-actions button.rate-btn{background:transparent;border:1px solid var(--warning);color:var(--warning)}
.card-actions button:disabled{opacity:.5;cursor:not-allowed}
.empty{text-align:center;color:var(--text-mute);padding:25px;font-size:12px}
.check-form{background:var(--bg-inner);border:1px solid var(--accent-2);border-radius:8px;padding:10px;margin-top:8px}
.check-form-title{font-size:11px;color:var(--accent-2);margin-bottom:6px;font-weight:bold}
.check-form-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.check-form input[type="number"]{padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg-input);color:var(--accent-2);font-size:15px;font-family:monospace;width:130px;font-weight:bold}
.check-form input[type="file"]{display:none}
.check-form label{padding:8px 14px;border-radius:6px;background:var(--accent-2);color:#fff;font-weight:bold;cursor:pointer;font-size:12px}
.mode-toggle{position:fixed;bottom:15px;right:15px;display:flex;gap:6px;z-index:100}
.mode-toggle button{padding:10px 16px;border-radius:20px;border:none;background:var(--accent-2);color:#fff;cursor:pointer;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.3);font-size:12px}
.mode-toggle button.admin{background:var(--accent)}
.mode-toggle button.worker{background:var(--accent-2)}
.mode-toggle button.client{background:var(--heart)}
.mode-toggle button.settings{background:var(--text-mute);padding:10px 14px}
.loading{text-align:center;padding:25px;color:var(--text-mute)}
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:var(--accent-2);color:#fff;padding:10px 18px;border-radius:8px;font-weight:bold;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.4);font-size:13px;max-width:90%;text-align:center}
.toast.warn{background:var(--warning);color:#000}
.toast.err{background:var(--danger)}
.toast.info{background:var(--accent)}
.toast.heart{background:var(--heart)}
.toast.blue{background:var(--info)}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal-box{background:var(--bg-card);border:1px solid var(--accent);border-radius:12px;padding:22px;max-width:420px;width:100%;color:var(--text);margin:auto}
.modal-box.heart{border-color:var(--heart)}
.modal-box h3{font-size:15px;margin-bottom:15px;color:var(--accent);text-align:center}
.modal-box.heart h3{color:var(--heart)}
.modal-box p{font-size:12px;color:var(--text-dim);margin-bottom:12px;text-align:center}
.choice-btns{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}
.choice-btns button{padding:16px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg-inner);color:var(--text);font-size:15px;font-weight:bold;cursor:pointer}
.choice-btns button.client-btn{border-color:var(--heart);color:var(--heart)}
.choice-btns button.bt7-btn{border-color:var(--accent-2);color:var(--accent-2)}
.worker-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.worker-btns button{padding:14px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-inner);color:var(--text);font-size:14px;font-weight:bold;cursor:pointer}
.worker-btns button.admin-btn{grid-column:1/-1;border-color:var(--accent);color:var(--accent)}
.worker-btns button.registered::after{content:' ✓';color:var(--accent-2);font-weight:bold}
.pin-row{display:flex;gap:6px;margin-top:10px}
.pin-row input{flex:1;padding:10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-input);color:var(--accent-2);font-family:monospace;font-size:18px;text-align:center;letter-spacing:6px}
.pin-row input:focus{outline:none;border-color:var(--accent)}
.pin-row input.heart{border-color:var(--heart);color:var(--heart)}
.pin-row button{padding:10px 18px;border:none;border-radius:6px;background:var(--accent-2);color:#fff;font-weight:bold;cursor:pointer;font-size:13px}
.pin-row button.heart{background:var(--heart)}
.pin-row button:disabled{opacity:.5;cursor:not-allowed}
.pin-masked{-webkit-text-security:disc;text-security:disc;-moz-text-security:disc}
.pin-error{color:var(--danger);font-size:11px;margin-top:6px;min-height:14px;text-align:center}
.first-time-badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;background:var(--accent-2);color:#fff;font-weight:bold;margin-bottom:8px}
.uname-wrap{position:relative;margin-bottom:10px}
.uname-input{width:100%;padding:14px 16px 14px 42px;border-radius:10px;border:2px solid var(--heart);background:var(--bg-input);color:var(--text);font-size:16px;font-family:monospace;outline:none;font-weight:bold}
.uname-input:focus{border-color:var(--heart)}
.uname-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:#229ED9;pointer-events:none}
.uname-dropdown{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--bg-card);border:1px solid var(--heart);border-radius:10px;max-height:240px;overflow-y:auto;z-index:100;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.uname-dropdown.show{display:block}
.uname-item{padding:12px 16px;cursor:pointer;font-size:15px;border-bottom:1px solid var(--border);font-family:monospace;display:flex;align-items:center;gap:8px}
.uname-item:hover{background:rgba(255,77,109,.15)}
.uname-item .heart-inline{color:var(--heart)}
.uname-item .highlight-prefix{color:var(--accent-2);font-weight:bold}
.uname-new{padding:12px 16px;cursor:pointer;font-size:13px;color:var(--accent-2);font-weight:bold;background:rgba(16,185,129,.1);font-family:monospace}
.modal-cancel{margin-top:10px;padding:6px 12px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:12px;display:block;margin-left:auto;margin-right:auto}
.modal-textarea{width:100%;padding:10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);font-size:13px;margin-bottom:8px;min-height:70px;resize:vertical;font-family:inherit}
.modal-file-label{display:block;padding:10px;border-radius:6px;background:var(--bg-inner);color:var(--accent-2);text-align:center;cursor:pointer;font-size:12px;border:1px dashed var(--accent-2);margin-bottom:8px}
.modal-submit{width:100%;padding:11px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-weight:bold;cursor:pointer;font-size:13px}
.modal-submit.heart{background:var(--heart)}
.modal-submit:disabled{opacity:.5;cursor:not-allowed}
.shift-choice{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:10px}
.shift-choice button{padding:14px 12px;border:2px solid var(--border);border-radius:10px;background:var(--bg-inner);color:var(--text);font-size:14px;font-weight:bold;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.shift-choice button.morning{border-color:#f59e0b}
.shift-choice button.evening{border-color:#a855f7}
.shift-choice button.night{border-color:#3b82f6}
.shift-choice .time{font-size:11px;color:var(--text-dim);font-weight:normal}
.shift-choice button.selected{box-shadow:0 0 0 3px var(--accent-2)}
.rate-input-wrap{margin-bottom:10px}
.rate-input-wrap input{width:100%;padding:14px;border-radius:8px;border:2px solid var(--warning);background:var(--bg-input);color:var(--warning);font-size:22px;font-family:monospace;font-weight:bold;text-align:center;outline:none}
.rate-hint{font-size:11px;color:var(--text-dim);text-align:center;margin-top:6px}
.revive-confirm{display:flex;gap:8px;align-items:flex-start;margin:12px 0;font-size:13px;cursor:pointer;padding:10px;background:var(--bg-inner);border-radius:8px;border:1px solid var(--border)}
.revive-confirm.checked{border-color:var(--accent-2)}
.date-group{margin-bottom:10px}
.date-summary{padding:12px 16px;background:var(--bg-card);border:2px solid var(--accent);border-radius:10px;cursor:pointer;font-size:13px;font-weight:bold;color:var(--accent);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;user-select:none}
.date-summary .arrow{transition:transform .2s}
details[open]>.date-summary .arrow{transform:rotate(90deg)}
details[open]>.date-summary{margin-bottom:8px}
.date-content{padding-left:12px;border-left:2px solid var(--border)}
.shift-group{margin-bottom:8px}
.shift-summary{padding:10px 14px;background:var(--bg-inner);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;font-weight:bold;color:var(--text-dim);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;user-select:none}
.shift-summary.shift-morning{border-left:3px solid #f59e0b}
.shift-summary.shift-evening{border-left:3px solid #a855f7}
.shift-summary.shift-night{border-left:3px solid #3b82f6}
.shift-summary .arrow{transition:transform .2s}
details[open]>.shift-summary .arrow{transform:rotate(90deg)}
details[open]>.shift-summary{margin-bottom:6px}
.client-group{margin-bottom:6px}
.client-summary{padding:10px 14px 10px 20px;background:var(--bg-card);border:1px solid var(--border);border-left:3px solid #229ED9;border-radius:8px;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;user-select:none}
.client-summary .client-name{font-family:monospace;font-weight:bold;color:#229ED9}
.client-summary .client-stats{font-size:11px;color:var(--text-dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.client-summary .sum-done{color:var(--accent-2);font-weight:bold}
.client-summary .sum-cancel{color:var(--danger);font-weight:bold}
.client-summary .sum-expired{color:var(--danger);font-weight:bold}
.client-summary .badge-count{background:var(--border);padding:2px 6px;border-radius:6px;font-size:10px}
.client-summary .arrow{transition:transform .2s}
details[open]>.client-summary .arrow{transform:rotate(90deg)}
details[open]>.client-summary{margin-bottom:6px}
.client-content{padding-left:20px;border-left:2px dashed var(--border);margin-left:8px}
.admin-info{padding:12px 14px;background:var(--bg-card);border:1px solid var(--accent);border-radius:8px;font-size:12px;color:var(--text-dim);margin-bottom:12px;text-align:center}
.admin-info b{color:var(--accent)}
</style>
</head>
<body>

<h1>📊 Панель заявок <span id="workerBadge" class="badge"></span> <span id="rateBadge" class="badge rate"></span> <span id="clockBadge" class="badge clock">🕐 —</span></h1>
<div class="me" id="meInfo">Загрузка...</div>
<div class="admin-info" id="adminInfo" style="display:none;">👑 <b>Режим админа</b> — только просмотр архива всех воркеров.</div>

<div class="section" id="adminForm" style="display:none;">
  <h2>➕ Добавить заявку</h2>
  <div class="add-form">
    <input id="phone" placeholder="Телефон">
    <input id="cardNumber" placeholder="Номер карты">
    <input id="bank" placeholder="Банк">
    <input id="totalSum" type="number" placeholder="Сумма ₽">
    <input id="totalChecks" type="number" placeholder="Кол-во чеков">
    <input id="timerMin" type="number" placeholder="Таймер, мин" value="60">
    <input id="rate" type="number" placeholder="Курс" step="0.01">
    <button onclick="addPayout()">Добавить</button>
  </div>
</div>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input type="text" class="search-input" id="searchInput" placeholder="Поиск: карта, телефон, @username, банк, сумма..." oninput="onSearch()">
  <span class="search-count" id="searchCount"></span>
  <button class="search-clear" id="searchClear" onclick="clearSearch()" style="display:none;">×</button>
</div>

<div class="tabs">
  <button id="tabAvailable" class="active" onclick="setTab('available')">🟣 Доступные</button>
  <button id="tabActive" onclick="setTab('active')">🔥 В работе</button>
  <button id="tabExpired" class="hidden expired-tab" onclick="setTab('expired')">⏰ Просрочено</button>
  <button id="tabDone" onclick="setTab('done')">📦 Архив</button>
</div>

<div id="content" class="loading">Загрузка...</div>

<div style="position:fixed;bottom:15px;left:15px;display:flex;gap:4px;z-index:100;">
  <button onclick="setTheme('dark')" data-theme-btn="dark" title="Тёмная" style="width:30px;height:30px;border-radius:50%;border:2px solid var(--border);cursor:pointer;font-size:14px;background:var(--bg-card);color:var(--text);">🌑</button>
  <button onclick="setTheme('light')" data-theme-btn="light" title="Светлая" style="width:30px;height:30px;border-radius:50%;border:2px solid var(--border);cursor:pointer;font-size:14px;background:var(--bg-card);color:var(--text);">☀️</button>
  <button onclick="setTheme('ocean')" data-theme-btn="ocean" title="Океан" style="width:30px;height:30px;border-radius:50%;border:2px solid var(--border);cursor:pointer;font-size:14px;background:var(--bg-card);color:var(--text);">🌊</button>
</div>

<div class="mode-toggle">
  <button id="settingsBtn" class="settings" onclick="openSettings()" style="display:none;" title="Настройки">⚙</button>
  <button id="modeBtn" onclick="openLogin()">🔒 Войти</button>
</div>

<script type="module">

async function syncClock(silent=false){
  const endpoints=[
    {url:'https://timeapi.io/api/Time/current/zone?timeZone=UTC',parse:d=>new Date(d.dateTime.endsWith('Z')?d.dateTime:d.dateTime+'Z').getTime()},
    {url:'https://worldtimeapi.org/api/timezone/Etc/UTC',parse:d=>new Date(d.datetime).getTime()},
    {url:'https://worldtimeapi.org/api/ip',parse:d=>new Date(d.datetime).getTime()}
  ];
  for(const ep of endpoints){
    try{
      const t0=Date.now();const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),6000);
      const r=await fetch(ep.url,{cache:'no-store',signal:ctrl.signal});clearTimeout(to);
      const t1=Date.now();if(!r.ok)continue;
      const data=await r.json();const serverMs=ep.parse(data);
      if(!serverMs||isNaN(serverMs))continue;
      const newOffset=serverMs-Math.round((t0+t1)/2);
      if(Math.abs(newOffset)>MAX_OFFSET_MS)continue;
      const changed=Math.abs(newOffset-clockOffset)>30000;
      clockOffset=newOffset;clockSynced=true;
      sessionStorage.setItem('clockOffset',String(clockOffset));
      sessionStorage.setItem('clockSynced','1');
      updateClockBadge();
      if(!silent)showToast('🕐 Синхронизировано');
      if(changed){try{render();}catch(e){}}
      return true;
    }catch(e){}
  }
  updateClockBadge();
  return false;
}

async function hashPin(pin){

}

      try{

        lastErr=null;break;

async function registerStaff(displayName,roleType){
  const pin1=document.getElementById('pinField')?.value;
  const pin2=document.getElementById('pinField2')?.value;
  const err=document.getElementById('pinError');
  if(!pin1||pin1.length<4){err.textContent='❌ PIN минимум 4 цифры';return;}
  if(pin1.length>6){err.textContent='❌ PIN максимум 6 цифр';return;}
  if(pin1!==pin2){err.textContent='❌ PIN не совпадает';return;}
  if(!/^\d+$/.test(pin1)){err.textContent='❌ Только цифры';return;}
  if(!navigator.onLine){err.textContent='❌ Нет интернета';return;}
  const btn=document.querySelector('#loginModal .pin-row button');
  if(btn){btn.disabled=true;btn.textContent='⏳...';}
  try{
    const pinHash=await hashPin(pin1);
    await runTransaction(db,async(tx)=>{
      const ref=doc(db,'staff',displayName);
      const snap=await tx.get(ref);
      if(snap.exists())throw new Error('ALREADY_EXISTS');
      tx.set(ref,{name:displayName,role:roleType,pinHash,createdAt:now()});
    });
    allStaff.set(displayName,{name:displayName,role:roleType,pinHash,createdAt:now()});
    showToast('✅ PIN установлен');
    completeStaffLogin(roleType,displayName);
  }catch(e){
    const m=(e.message||'').toLowerCase();
    if(e.message==='ALREADY_EXISTS'){
      err.textContent='❌ Уже зарегистрирован — введи PIN';
      setTimeout(()=>showStaffPinInput(displayName,roleType),900);
      return;
    }
    if(m.includes('offline')||m.includes('unavailable')||m.includes('network')){
      err.textContent='❌ Нет связи с сервером. Проверь интернет.';
    }else{
      err.textContent='❌ Ошибка: '+e.message;
    }
    if(btn){btn.disabled=false;btn.textContent='Создать PIN и войти';}
  }
}

function filterPayouts(list,tab){
  if(role==='admin'){
    if(tab==='done'||tab==='expired')return list;
    return [];
  }
  if(role==='worker'){
    if(tab==='available')return list;
    if(tab==='active')return list.filter(p=>p.createdBy===workerName);
    if(tab==='expired')return list.filter(p=>p.createdBy===workerName);
    if(tab==='done')return list.filter(p=>p.createdBy===workerName);
  }
  if(role==='client'){
    if(tab==='available')return list;
    if(tab==='active')return list.filter(p=>p.client===clientUsername);
    if(tab==='done')return list.filter(p=>p.client===clientUsername);
  }
  if(tab==='available')return list;
  return [];
}

// ═══ АТОМАРНЫЙ ЗАХВАТ ═══
async function takePayout(id){
  if(role!=='client'){alert('❌ Только клиент');return;}
  if(takingIds.has(id))return;
  takingIds.add(id);
  try{
    await runTransaction(db,async(tx)=>{
      const ref=doc(db,'payouts',id);
      const snap=await tx.get(ref);
      if(!snap.exists())throw new Error('not_found');
      const data=snap.data();
      if(data.status==='active'||data.status==='done'||data.status==='cancelled')throw new Error('already_taken');
      if(data.status==='expired')throw new Error('expired');
      if(data.status!=='available')throw new Error('not_available');
      const leftMs=(data.timerMin||0)*60000-(now()-(data.createdAt||0));
      if(leftMs<0){tx.update(ref,{status:'expired',expiredAt:now()});throw new Error('expired');}
      tx.update(ref,{status:'active',client:clientUsername,startedAt:now()});
    });
    setTab('active');
    showToast('❤️ Взято в работу!','heart');
  }catch(e){
    const m=e.message||'';
    if(m.includes('already_taken'))showToast('❌ Уже взята другим клиентом','err');
    else if(m.includes('expired'))showToast('⏰ Время истекло — заявка в «Просрочено»','warn');
    else if(m.includes('not_found'))showToast('❌ Заявка не найдена','err');
    else if(m.includes('not_available'))showToast('❌ Заявка недоступна','err');
    else showToast('Ошибка: '+m,'err');
  }finally{takingIds.delete(id);}
}

async function uploadCheck(id,inputEl){
  const p=payouts.find(x=>x.id===id);if(!p)return;
  const isOwner=(role==='client'&&p.client===clientUsername)||(role==='worker');
  if(!isOwner){alert('❌ Нельзя');return;}
  const file=inputEl.files[0];
  const sumEl=document.getElementById('checkSum_'+id);
  const sum=parseFloat(sumEl.value);
  if(!file){alert('Выбери файл');return;}
  if(!sum||sum<=0){alert('Введи сумму чека');return;}
  if(file.size>900000){alert('Файл > 900 KB');return;}
  const btn=inputEl.parentElement.querySelector('label');const oldText=btn.textContent;btn.textContent='⏳...';
  try{
    const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});
    const newChecks=[...(p.checks||[]),{data:base64,fileName:file.name,fileType:file.type,sum,uploadedAt:now()}];
    const totalPaid=newChecks.reduce((s,c)=>s+c.sum,0);
    const update={checks:newChecks};
    if(totalPaid>=p.totalSum){update.status='done';update.finishedAt=now();}
    await updateDoc(doc(db,'payouts',id),update);
    delete checkInputs[id];localStorage.setItem('checkInputs',JSON.stringify(checkInputs));
    sumEl.value='';inputEl.value='';
    showToast('✅ Чек на '+Math.round(sum).toLocaleString('ru-RU')+' ₽');
  }catch(e){alert('Ошибка: '+e.message);}
  finally{btn.textContent=oldText;}
}

function paidSum(p){return (p.checks||[]).reduce((s,c)=>s+c.sum,0);}
function formatMoney(n){return Math.round(n).toLocaleString('ru-RU')+' ₽';}
function formatTime(ms){if(ms<0)ms=0;const total=Math.floor(ms/1000);const h=Math.floor(total/3600);const m=Math.floor((total%3600)/60);const s=total%60;if(h>0)return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function copyText(text){navigator.clipboard.writeText(text).then(()=>showToast('📋 Скопировано')).catch(()=>{});}
function saveCheckInput(id,value){checkInputs[id]=value;localStorage.setItem('checkInputs',JSON.stringify(checkInputs));}
document.addEventListener('click',(e)=>{

  if(!el)return;

});
function getCurrentShift(){const h=new Date(now()).getHours();if(h>=6&&h<14)return 'Утро';if(h>=14&&h<22)return 'Вечер';return 'Ночь';}
function getShiftEmoji(s){if(s==='Утро')return '🌅';if(s==='Вечер')return '🌆';if(s==='Ночь')return '🌙';return '⏰';}
function getShiftClass(s){if(s==='Утро')return 'shift-morning';if(s==='Вечер')return 'shift-evening';if(s==='Ночь')return 'shift-night';return '';}

function renderCard(p){
  const paid=paidSum(p);
  const left=Math.max(0,p.totalSum-paid);
  const pct=Math.min(100,(paid/p.totalSum)*100);
  const checksCount=(p.checks||[]).length;
  const isMine=(role==='client'&&p.client===clientUsername);
  const canEditRate=role==='worker';

  let timerHtml='';let cardExtraClass='';
  if((p.status==='available'||p.status==='active')&&p.createdAt){
    const limitMs=p.timerMin*60000;
    const leftMs=limitMs-(now()-p.createdAt);
    let cls;
    if(p.status==='available'){
      if(leftMs<0)cls='dead';
      else if(leftMs<5*60000)cls='red';
      else if(leftMs<10*60000)cls='orange';
      else if(leftMs<15*60000)cls='yellow';
      else cls='gray';
    }else{
      if(leftMs<0)cls='red';
      else if(leftMs<5*60000)cls='red';
      else if(leftMs<10*60000)cls='orange';
      else if(leftMs<15*60000)cls='yellow';
      else cls='green';
    }
    if(p.status==='active'){if(leftMs<0)cardExtraClass=' expired';else if(leftMs<10*60000)cardExtraClass=' warning';}
    timerHtml=`<span class="timer ${cls}" data-timer-start="${p.createdAt}" data-timer-limit="${limitMs}" data-payout-id="${p.id}">${formatTime(leftMs)}</span>`;
  }
  let expiredTagHtml='';
  if(p.status==='expired'){expiredTagHtml=`<div class="expired-tag">⏰ Не обработана — время истекло</div>`;}
  let revivedTagHtml='';
  if(p.revivedAt&&p.status!=='expired'){
    const t=new Date(p.revivedAt).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    revivedTagHtml=`<div class="card-row small" style="color:var(--info)">🔄 Возрождена: ${t} • ${esc(p.revivedBy||'—')}${p.reviveCount>1?' (×'+p.reviveCount+')':''}</div>`;
  }
  let actions='';
  if(p.status==='available'){
    if(role==='client'){
      const leftMs=p.timerMin*60000-(now()-p.createdAt);
      if(leftMs>0){actions=`<div class="card-actions"><button class="green" onclick="takePayout('${p.id}')">❤️ Взять в работу</button></div>`;}
      else{actions=`<div class="card-actions"><button class="gray" disabled>⏰ Время истекло</button></div>`;}
    }else if(role==='worker'){
      actions=`<div class="card-actions">`;
      if(canEditRate)actions+=`<button class="rate-btn" onclick="editRate('${p.id}')">✏️ Курс</button>`;
      if(p.createdBy===workerName)actions+=`<button class="red" onclick="deletePayout('${p.id}')">× Удалить</button>`;
      actions+=`</div>`;
    }
  }else if(p.status==='active'){
    const savedSum=checkInputs[p.id]||'';
    const canUpload=isMine||role==='worker';
    if(canUpload){actions=`<div class="check-form"><div class="check-form-title">💵 Загрузить чек</div><div class="check-form-row"><input type="number" id="checkSum_${p.id}" placeholder="Сумма ₽" step="0.01" value="${savedSum}" oninput="saveCheckInput('${p.id}', this.value)"><input type="file" id="checkFile_${p.id}" accept=".pdf,image/*" onchange="uploadCheck('${p.id}', this)"><label for="checkFile_${p.id}">📎 Чек</label></div></div>`;}
    if(isMine){actions+=`<div class="card-actions"><button class="orange" onclick="openProblemModal('${p.id}')">⚠️ Проблема</button><button class="red" onclick="cancelByClient('${p.id}')">❌ Отменить</button></div>`;}
    if(role==='worker'){actions+=`<div class="card-actions"><button class="green" onclick="finishPayout('${p.id}')">✅ Завершить</button><button class="orange" onclick="extendTimer('${p.id}', 30)">⏰ +30</button><button class="orange" onclick="extendTimer('${p.id}', 60)">⏰ +1ч</button><button class="gray" onclick="returnToAvailable('${p.id}')">⏸ Вернуть</button></div>`;}
  }else if(p.status==='expired'){
    if(role==='worker'&&p.createdBy===workerName){
      actions=`<div class="card-actions"><button class="green" onclick="revivePayout('${p.id}')">🔄 Вернуть в пул</button><button class="red" onclick="deletePayout('${p.id}')">× Удалить</button></div>`;
    }
  }
  let checksHtml='';
  if((p.checks||[]).length){
    checksHtml=`<div class="checks-list">`+p.checks.map((c,i)=>`<div class="check-item"><span>📄 Чек ${i+1}: <b>${formatMoney(c.sum)}</b> <span style="color:var(--text-mute);font-size:10px">${new Date(c.uploadedAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</span></span><a href="${c.data}" download="${esc(c.fileName)}" target="_blank">Скачать ⬇</a></div>`).join('')+`</div>`;
  }
  let problemsHtml='';
  if((p.problems||[]).length){
    problemsHtml=`<div class="checks-list" style="border-top:1px solid var(--danger);padding-top:6px;margin-top:6px;"><div style="font-size:11px;color:var(--danger);font-weight:bold;margin-bottom:4px;">⚠️ Проблемы:</div>${p.problems.map(pr=>`<div class="check-item" style="background:rgba(239,68,68,0.1);"><span style="font-size:11px;">${esc(pr.text||'(без описания)')} <span style="color:var(--text-mute);font-size:10px">${new Date(pr.createdAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</span></span>${pr.file?`<a href="${pr.file.data}" download="${esc(pr.file.name)}" target="_blank" style="color:var(--danger)">Скачать ⬇</a>`:''}</div>`).join('')}</div>`;
  }
  let cancelHtml='';
  if(p.status==='cancelled'){cancelHtml=`<div class="card-row small" style="color:var(--danger)">❌ Отменено: ${esc(p.cancelReason||'')}</div>`;}
  let metaHtml='';
  if(role!=='guest'&&(p.createdBy||p.shift)){
    const dateStr=new Date(p.originalCreatedAt||p.createdAt).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    metaHtml=`<div class="card-row small">🛠 ${esc(p.createdBy||'—')} • ${getShiftEmoji(p.shift)} ${esc(p.shift||'—')} • ${dateStr}</div>`;
  }
  const rateHtml=p.rate?`<div class="card-row small">💱 Курс: <span class="rate-value" ${canEditRate?`onclick="editRate('${p.id}')"`:''}>${p.rate} ₽/USDT</span>${canEditRate?' ✏️':''}</div>`:'';
  const cardHtml=p.cardNumber?`<div class="card-row">💳 Карта: <span class="card-num" data-copy="${esc(p.cardNumber)}">${highlightMatch(p.cardNumber)}</span></div>`:'';
  const phoneHtml=p.phone?`<div class="card-row">📱 Телефон: <span class="phone-num" data-copy="${esc(p.phone)}">${highlightMatch(p.phone)}</span></div>`:'';
  const heartPrefix=isMine?'❤️ ':'';
  return `<div class="card ${p.status}${cardExtraClass}${isMine?' mine':''}">
      <div class="card-header"><b>${heartPrefix}${formatMoney(p.totalSum)}</b>${timerHtml}</div>
      ${expiredTagHtml}${revivedTagHtml}${cardHtml}${phoneHtml}
      ${p.bank?`<div class="card-row small">🏦 ${esc(p.bank)}</div>`:''}
      ${rateHtml}
      ${p.client?`<div class="card-row small">❤️ Клиент: ✈️ ${highlightMatch(p.client)}</div>`:''}
      ${metaHtml}
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="card-row small">💰 Оплачено: <b>${formatMoney(paid)}</b> / ${formatMoney(p.totalSum)} • Осталось: <b>${formatMoney(left)}</b> • 📄 ${checksCount}/${p.totalChecks}</div>
      ${checksHtml}${problemsHtml}${cancelHtml}${actions}
    </div>`;
}

function renderArchive(list){
  const byDate={};
  list.forEach(p=>{
    const d=new Date(p.createdAt);
    const dateKey=d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
    const shift=p.shift||'Без смены';
    if(!byDate[dateKey])byDate[dateKey]={date:dateKey,latestAt:0,shifts:{}};
    if(!byDate[dateKey].shifts[shift])byDate[dateKey].shifts[shift]=[];
    byDate[dateKey].shifts[shift].push(p);
    if(p.createdAt>byDate[dateKey].latestAt)byDate[dateKey].latestAt=p.createdAt;
  });
  const sortedDates=Object.keys(byDate).sort((a,b)=>byDate[b].latestAt-byDate[a].latestAt);
  const currentShift=getCurrentShift();
  const todayStr=new Date(now()).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
  let html='';
  sortedDates.forEach((dateKey,dateIdx)=>{
    const dayData=byDate[dateKey];
    const isToday=dateKey===todayStr;
    const totalCount=Object.values(dayData.shifts).reduce((s,arr)=>s+arr.length,0);
    const totalDone=Object.values(dayData.shifts).flat().filter(p=>p.status==='done').reduce((s,p)=>s+p.totalSum,0);
    const dateOpenAttr=(dateIdx===0||isToday||!!searchQuery)?' open':'';
    html+=`<details class="date-group"${dateOpenAttr}><summary class="date-summary"><span>${isToday?'🔥 ':'📅 '}${dateKey}</span><span>${totalCount} заявок • ${Math.round(totalDone).toLocaleString('ru-RU')} ₽</span><span class="arrow">▶</span></summary><div class="date-content">`;
    SHIFTS.forEach(shift=>{
      const items=dayData.shifts[shift]||[];
      if(!items.length)return;
      const isCurrentShift=isToday&&shift===currentShift;
      const shiftOpenAttr=(isCurrentShift||!!searchQuery)?' open':'';
      const doneSum=items.filter(p=>p.status==='done').reduce((s,p)=>s+p.totalSum,0);
      const byClient={};
      items.forEach(p=>{const client=p.client||'(без клиента)';if(!byClient[client])byClient[client]=[];byClient[client].push(p);});
      const clientKeys=Object.keys(byClient).sort((a,b)=>{
        const sumA=byClient[a].filter(p=>p.status==='done').reduce((s,p)=>s+p.totalSum,0);
        const sumB=byClient[b].filter(p=>p.status==='done').reduce((s,p)=>s+p.totalSum,0);
        if(sumB!==sumA)return sumB-sumA;return a.localeCompare(b,'ru');
      });
      html+=`<details class="shift-group"${shiftOpenAttr}><summary class="shift-summary ${getShiftClass(shift)}"><span>${getShiftEmoji(shift)} ${shift} <span style="font-size:10px;color:var(--text-mute);font-weight:normal;">${SHIFT_TIMES[shift]||''}</span></span><span>${items.length} заявок • ${Math.round(doneSum).toLocaleString('ru-RU')} ₽</span><span class="arrow">▶</span></summary><div class="shift-content">`;
      clientKeys.forEach(clientKey=>{
        const clientPayouts=byClient[clientKey];
        const clientDone=clientPayouts.filter(p=>p.status==='done');
        const clientCancelled=clientPayouts.filter(p=>p.status==='cancelled');
        const clientActive=clientPayouts.filter(p=>p.status==='active');
        const clientAvailable=clientPayouts.filter(p=>p.status==='available');
        const clientExpired=clientPayouts.filter(p=>p.status==='expired');
        const doneSum2=clientDone.reduce((s,p)=>s+p.totalSum,0);
        const isClient=clientKey!=='(без клиента)';
        html+=`<details class="client-group"><summary class="client-summary"><span>${isClient?'✈️ ':'👤 '}<span class="client-name">${esc(clientKey)}</span></span><span class="client-stats"><span class="badge-count">${clientPayouts.length} заявок</span><span class="sum-done">✅ ${formatMoney(doneSum2)}</span>${clientCancelled.length?`<span class="sum-cancel">❌ ${clientCancelled.length}</span>`:''}${clientExpired.length?`<span class="sum-expired">⏰ ${clientExpired.length}</span>`:''}${clientActive.length?`<span style="color:var(--warning)">🔥 ${clientActive.length}</span>`:''}${clientAvailable.length?`<span style="color:var(--accent)">⏳ ${clientAvailable.length}</span>`:''}</span><span class="arrow">▶</span></summary><div class="client-content">${clientPayouts.map(renderCard).join('')}</div></details>`;
      });
      html+=`</div></details>`;
    });
    if(dayData.shifts['Без смены']&&dayData.shifts['Без смены'].length){
      const items=dayData.shifts['Без смены'];
      const doneSum=items.filter(p=>p.status==='done').reduce((s,p)=>s+p.totalSum,0);
      const byClient={};
      items.forEach(p=>{const client=p.client||'(без клиента)';if(!byClient[client])byClient[client]=[];byClient[client].push(p);});
      const clientKeys=Object.keys(byClient).sort();
      html+=`<details class="shift-group"><summary class="shift-summary"><span>❓ Без смены</span><span>${items.length} заявок • ${Math.round(doneSum).toLocaleString('ru-RU')} ₽</span><span class="arrow">▶</span></summary><div class="shift-content">`;
      clientKeys.forEach(clientKey=>{
        const clientPayouts=byClient[clientKey];
        const clientDone=clientPayouts.filter(p=>p.status==='done');
        const clientCancelled=clientPayouts.filter(p=>p.status==='cancelled');
        const clientExpired=clientPayouts.filter(p=>p.status==='expired');
        const doneSum2=clientDone.reduce((s,p)=>s+p.totalSum,0);
        html+=`<details class="client-group"><summary class="client-summary"><span>✈️ <span class="client-name">${esc(clientKey)}</span></span><span class="client-stats"><span class="badge-count">${clientPayouts.length} заявок</span><span class="sum-done">✅ ${formatMoney(doneSum2)}</span>${clientCancelled.length?`<span class="sum-cancel">❌ ${clientCancelled.length}</span>`:''}${clientExpired.length?`<span class="sum-expired">⏰ ${clientExpired.length}</span>`:''}</span><span class="arrow">▶</span></summary><div class="client-content">${clientPayouts.map(renderCard).join('')}</div></details>`;
      });
      html+=`</div></details>`;
    }
    html+=`</div></details>`;
  });
  return html;
}

function render(){
  const el=document.getElementById('content');
  let baseList=[];
  if(currentTab==='available'){
    baseList=payouts.filter(p=>p.status==='available');
    baseList=baseList.filter(p=>{const left=p.timerMin*60000-(now()-p.createdAt);return left>0;});
  }else if(currentTab==='active'){baseList=payouts.filter(p=>p.status==='active');}
  else if(currentTab==='expired'){baseList=payouts.filter(p=>p.status==='expired');}
  else{baseList=payouts.filter(p=>p.status==='done'||p.status==='cancelled');}
  let list=filterPayouts(baseList,currentTab);
  if(searchQuery)list=list.filter(matchSearch);
  const countEl=document.getElementById('searchCount');
  if(countEl){
    if(searchQuery){countEl.textContent=list.length?'🔍 '+list.length:'❌ 0';countEl.className='search-count'+(list.length?'':' no-results');}
    else{countEl.textContent='';countEl.className='search-count';}
  }
  if(!list.length){
    el.innerHTML=`<div class="empty">${
      searchQuery?'🔍 Ничего не найдено':
      currentTab==='available'?'Нет доступных заявок':
      currentTab==='active'?(role==='guest'?'Войди, чтобы видеть':'Нет заявок в работе'):
      currentTab==='expired'?'✅ Нет просроченных заявок':
      (role==='guest'?'Войди, чтобы видеть архив':'Архив пуст')}</div>`;
    return;
  }
  if(currentTab==='done')el.innerHTML=renderArchive(list);
  else el.innerHTML=list.map(renderCard).join('');
}

// ═══ ТИК ═══
setInterval(()=>{
  if(role==='worker'){
    payouts.forEach(p=>{
      if(p.status!=='available')return;
      if(p.createdBy!==workerName)return;
      const leftMs=p.timerMin*60000-(now()-p.createdAt);
      if(leftMs<0&&!expiringIds.has(p.id)){
        expiringIds.add(p.id);
        updateDoc(doc(db,'payouts',p.id),{status:'expired',expiredAt:now()}).catch(e=>{console.warn('expire failed',e);expiringIds.delete(p.id);});
      }
    });
  }
  document.querySelectorAll('[data-timer-start]').forEach(el=>{
    const start=parseInt(el.dataset.timerStart);
    const limit=parseInt(el.dataset.timerLimit);
    const id=el.dataset.payoutId;
    const left=limit-(now()-start);
    el.textContent=formatTime(left);
    const p=payouts.find(x=>x.id===id);if(!p)return;
    let cls;
    if(p.status==='available'){
      if(left<0)cls='dead';
      else if(left<5*60000)cls='red';
      else if(left<10*60000)cls='orange';
      else if(left<15*60000)cls='yellow';
      else cls='gray';
    }else if(p.status==='active'){
      if(left<0)cls='red';
      else if(left<5*60000)cls='red';
      else if(left<10*60000)cls='orange';
      else if(left<15*60000)cls='yellow';
      else cls='green';
    }else{cls='gray';}
    el.className='timer '+cls;
    if(role!=='worker')return;
    if(p.createdBy!==workerName)return;
    if(left>0&&left<5*60000&&!warned5.has(id)){
      warned15.add(id);warned10.add(id);warned5.add(id);persistWarned();
      strongNotify('🔴 5 МИНУТ!',formatMoney(p.totalSum)+' — срочно!',{sound:'warning',toastType:'err',vibrate:[500,200,500,200,500],dedupeKey:'w5_'+id});
    }else if(left>0&&left<10*60000&&!warned10.has(id)){
      warned15.add(id);warned10.add(id);persistWarned();
      strongNotify('🟠 10 минут',formatMoney(p.totalSum),{sound:'warning',toastType:'warn',vibrate:[300,100,300],dedupeKey:'w10_'+id});
    }else if(left>0&&left<15*60000&&!warned15.has(id)){
      warned15.add(id);persistWarned();
      strongNotify('🟡 15 минут',formatMoney(p.totalSum),{sound:'warning',toastType:'warn',vibrate:[200,100,200],dedupeKey:'w15_'+id});
    }
  });
},1000);

// ═══ ПОДПИСКИ FIREBASE ═══
onSnapshot(clientsRef,snapshot=>{
  allClients=snapshot.docs.map(d=>d.data());
  allClients.sort((a,b)=>(a.username||'').localeCompare(b.username||'','ru'));
},err=>{console.warn('Clients snapshot error:',err.message);});

onSnapshot(staffRef,snapshot=>{
  allStaff.clear();
  snapshot.docs.forEach(d=>allStaff.set(d.id,{name:d.id,...d.data()}));
  console.log('👥 Staff loaded:',[...allStaff.keys()].join(', '));
},err=>{console.warn('Staff snapshot error:',err.message);});

onSnapshot(query(payoutsRef,orderBy('createdAt','desc')),snapshot=>{
  const newPayouts=snapshot.docs.map(d=>({id:d.id,...d.data()}));
  if(role==='client'&&!isFirstSnapshot){
    newPayouts.forEach(p=>{
      if(!seenPayoutIds.has(p.id)&&p.status==='available'){
        const age=now()-p.createdAt;
        if(age>=0&&age<120000){
          const rateTxt=p.rate?' • 💱 '+p.rate:'';const bankTxt=p.bank?' • '+p.bank:'';
          strongNotify('❤️ Новая заявка!',formatMoney(p.totalSum)+bankTxt+rateTxt,{sound:'new',toastType:'heart',vibrate:[100,50,100],dedupeKey:'new_'+p.id});
        }
      }
    });
  }
  if(role==='worker'){
    newPayouts.forEach(p=>{
      const prev=prevState.get(p.id);
      const checksCount=(p.checks||[]).length;
      const problemsCount=(p.problems||[]).length;
      if(prev){
        const isMyPayout=(p.createdBy===workerName);
        if(isMyPayout&&prev.status==='available'&&p.status==='active'){strongNotify('🟢 Взяли в работу',formatMoney(p.totalSum)+(p.client?' • '+p.client:''),{sound:'taken',toastType:'blue',vibrate:[50,30,50],dedupeKey:'taken_'+p.id+'_'+p.status});}
        if(isMyPayout&&checksCount>prev.checksCount){const lastCheck=p.checks[checksCount-1];strongNotify('💰 Чек оплачен',formatMoney(p.totalSum)+' → +'+formatMoney(lastCheck.sum),{sound:'check',toastType:'',vibrate:[200,100,200],dedupeKey:'check_'+p.id+'_'+checksCount});}
        if(isMyPayout&&problemsCount>prev.problemsCount){strongNotify('⚠️ Проблема от клиента','Заявка '+formatMoney(p.totalSum),{sound:'warning',toastType:'warn',vibrate:[300,100,300,100,300],dedupeKey:'prob_'+p.id+'_'+problemsCount});}
        if(isMyPayout&&prev.status!=='cancelled'&&p.status==='cancelled'){strongNotify('❌ Клиент отменил',formatMoney(p.totalSum),{sound:'warning',toastType:'err',vibrate:[300,100,300],dedupeKey:'cancel_'+p.id});}
        if(isMyPayout&&prev.status==='active'&&p.status==='done'){strongNotify('🎉 Заявка закрыта',formatMoney(p.totalSum),{sound:'check',toastType:'',vibrate:[100,50,100,50,200],dedupeKey:'done_'+p.id});}
        if(isMyPayout&&prev.status==='available'&&p.status==='expired'){strongNotify('⏰ Заявка просрочена',formatMoney(p.totalSum)+' — в «Просрочено»',{sound:'warning',toastType:'warn',vibrate:[300,100,300],dedupeKey:'expired_'+p.id});}
        if(isMyPayout&&prev.status==='expired'&&p.status==='available'){strongNotify('🔄 Возрождена в пул',formatMoney(p.totalSum),{sound:'taken',toastType:'info',vibrate:[100,50,100],dedupeKey:'revived_'+p.id+'_'+p.createdAt});}
      }
    });
  }
  prevState.clear();
  newPayouts.forEach(p=>prevState.set(p.id,{status:p.status,checksCount:(p.checks||[]).length,problemsCount:(p.problems||[]).length,client:p.client||null}));
  newPayouts.forEach(p=>seenPayoutIds.add(p.id));
  isFirstSnapshot=false;
  payouts=newPayouts;
  render();
},err=>{document.getElementById('content').innerHTML=`<div class="empty">❌ Ошибка: ${esc(err.message)}</div>`;});

updateModeUI();
render();

setTimeout(()=>{const rateInput=document.getElementById('rate');if(rateInput&&shiftRate)rateInput.value=shiftRate;},200);

Object.assign(window,{
  takePayout,uploadCheck,finishPayout,returnToAvailable,deletePayout,
  addPayout,setTab,copyText,openLogin,extendTimer,saveCheckInput,
  openSettings,closeSettings,toggleSound,selectClientType,selectBT7Type,
  closeLogin,setTheme,
  openProblemModal,closeProblemModal,submitProblem,cancelByClient,
  editRate,onSearch,clearSearch,proceedClientUsername,verifyClientPin,
  registerClient,askShiftModal,askRateModal,pickShift,confirmShift,
  cancelShift,confirmRate,cancelRate,syncClock,
  revivePayout,closeReviveModal,confirmRevive,
  proceedStaffLogin,registerStaff,verifyStaffPin,completeStaffLogin,
  openPinChange,closePinChange,submitPinChange
});
</script>
